name: Release

# Builds a Developer ID signed and notarized SoundPilot DMG, attaches it to the
# GitHub Release that triggered the run, and regenerates the Sparkle appcast.
#
# SoundPilot is NOT distributed through the Mac App Store (per-app audio taps
# and DDC need App Sandbox off), so the DMG is the only release channel.
#
# ─── RELEASE-DRIVEN, NOT COMMIT-DRIVEN ──────────────────────────────────────
# The trigger is a *published release*, not a tag push and not a commit. The
# release is the unit of shipping, so the release is what starts the build and
# what names the run. Everything the build needs about the version comes from
# the release's tag; nothing is derived from commit history.
#
# Cut a release and the DMG attaches itself:
#
#     gh release create v1.2.3 --generate-notes
#
# That creates the tag, the release, and this run in one step. Publishing an
# existing draft from the web UI works identically.
#
# `workflow_dispatch` builds on demand without shipping:
#   tag     = version label to build (e.g. v1.2.3)
#   publish = false → build only, DMG attached to the workflow run
#             true  → also create/update that release and update the appcast
#
# ─── VERSIONING ─────────────────────────────────────────────────────────────
# MARKETING_VERSION is the tag minus its leading "v" and any pre-release
# suffix. CURRENT_PROJECT_VERSION is computed *from that version*, because
# Sparkle compares build numbers rather than marketing versions, and a
# commit-count build number would drift with unrelated pushes:
#
#     major*1000000 + minor*10000 + patch*100 + stage
#
# where `stage` is the pre-release counter (v1.2.3-beta.4 → 4) and 99 for a
# final release. So 1.2.3-beta.4 → 1020304 and 1.2.3 → 1020399: a beta always
# sorts below its own final, and every release sorts above the one before it.
# Keep minor and patch under 100 and pre-release counters under 99.
#
# ─── SECRETS ────────────────────────────────────────────────────────────────
# Stored in the `release` ENVIRONMENT (Settings → Environments → release).
#
#   MACOS_CERTIFICATE       base64 of the "Developer ID Application" .p12
#                           (export from Keychain Access WITH the private key)
#   MACOS_CERTIFICATE_PWD   password of that .p12
#   APPLE_TEAM_ID           10-character team id
#   ASC_KEY_P8              base64 of AuthKey_<ASC_KEY_ID>.p8 — App Store
#                           Connect API key, used only for notarization
#   ASC_KEY_ID              App Store Connect key id
#   ASC_ISSUER_ID           App Store Connect issuer id (UUID)
#   KEYCHAIN_PASSWORD       optional; any string for the throwaway CI keychain
#   SPARKLE_PRIVATE_KEY     optional; contents of the file written by
#                           `./scripts/sparkle-tools.sh export-key`. When set,
#                           appcast.xml is regenerated, signed, and committed
#                           to main so existing installs see the update.
#
# Without MACOS_CERTIFICATE the DMG is built UNSIGNED and un-notarized; macOS
# warns on first launch (right-click → Open). Fine for testing the pipeline,
# not for shipping.
# ────────────────────────────────────────────────────────────────────────────

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build (e.g. v1.2.3)"
        required: true
        default: v0.0.0-manual
        type: string
      publish:
        description: "Publish the release (false = build only)"
        required: true
        default: false
        type: boolean

# Names the run after the release rather than the head commit message, so the
# Actions list reads as a list of versions.
run-name: >-
  ${{ github.event_name == 'release'
      && format('SoundPilot {0}', github.event.release.tag_name)
      || format('SoundPilot {0} ({1})', inputs.tag, inputs.publish && 'publish' || 'build only') }}

env:
  APP_NAME: SoundPilot
  SCHEME: SoundPilot

concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  dmg:
    name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }} → notarized DMG
    # Needs Xcode 26+ for Swift 6.2 features; setup-xcode picks the newest the image has.
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the release's own tag, not the branch head: the release is
          # the thing being built, so the build must match what was tagged.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version from the release tag
        id: ver
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-$INPUT_TAG}"

          # 1.2.3 out of v1.2.3-beta.4
          MARKETING="${TAG#v}"
          MARKETING="${MARKETING%%-*}"

          # Pre-release counter: the trailing digits of the suffix, else 99 for
          # a final release. See the versioning note at the top of this file.
          SUFFIX="${TAG#*-}"
          if [[ "$SUFFIX" == "$TAG" ]]; then
            STAGE=99
          else
            STAGE="$(printf '%s' "$SUFFIX" | grep -oE '[0-9]+$' || echo 1)"
            (( STAGE > 98 )) && STAGE=98
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$MARKETING"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          if ! [[ "$MAJOR$MINOR$PATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH — cannot derive a build number"
            exit 1
          fi
          BUILD=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + STAGE ))

          # A tag with a suffix is a pre-release even when dispatched manually.
          if [[ "${IS_PRERELEASE:-}" == "true" || "$SUFFIX" != "$TAG" ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "tag=$TAG"
            echo "marketing=$MARKETING"
            echo "build=$BUILD"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Building $TAG → version $MARKETING build $BUILD (prerelease=$PRERELEASE)"

      - name: Import Developer ID certificate
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE:-}" ]]; then
            echo "::warning::MACOS_CERTIFICATE unset — building UNSIGNED."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CERT="$RUNNER_TEMP/developer_id.p12"
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          KC_PASS="${KEYCHAIN_PASSWORD:-soundpilot-ci}"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$CERT" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KC"
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychain -d user -s "$KC"
          ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          if [[ -z "$ID" ]]; then
            echo "::error::No 'Developer ID Application' identity in the .p12 — re-export WITH the private key."
            exit 1
          fi
          echo "Identity: $ID"
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Archive app
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          SIGN_ARGS=()
          if [[ "$SIGNED" == "true" ]]; then
            # Xcode signs the app, Sparkle.framework and its XPC helpers with
            # the right entitlements and hardened runtime (ENABLE_HARDENED_RUNTIME
            # is set in the project), which is what notarization requires.
            SIGN_ARGS=(
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY="$IDENTITY"
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
              OTHER_CODE_SIGN_FLAGS=--timestamp
            )
          else
            SIGN_ARGS=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi
          xcodebuild -project SoundPilot.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            "${SIGN_ARGS[@]}" \
            archive | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" "$RUNNER_TEMP/archive.log"
          APP="$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          test -d "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      # Xcode re-signs Sparkle.framework itself, but not the helpers nested inside it
      # (Updater.app, Autoupdate, the XPC services). Those keep Sparkle's own
      # signature, which Apple rejects: "not signed with a valid Developer ID
      # certificate" / "does not include a secure timestamp". Re-sign inside-out
      # with our identity, hardened runtime and a timestamp, keeping each
      # component's entitlements, then re-seal the framework and the app.
      - name: Re-sign nested Sparkle helpers
        if: steps.signing.outputs.signed == 'true'
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          if [[ -d "$SPARKLE" ]]; then
            V="$SPARKLE/Versions/B"
            for t in \
              "$V/XPCServices/Installer.xpc" \
              "$V/XPCServices/Downloader.xpc" \
              "$V/Updater.app" \
              "$V/Autoupdate" \
              "$SPARKLE"
            do
              [[ -e "$t" ]] || continue
              codesign --force --options runtime --timestamp \
                --preserve-metadata=entitlements --sign "$IDENTITY" "$t"
              echo "re-signed: ${t#"$APP/"}"
            done
          fi
          # Any other embedded framework or helper, then the app itself (its seal
          # covers the nested code, so it must be signed last).
          find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' ! -name 'Sparkle.framework' -print0 2>/dev/null \
            | xargs -0 -I{} codesign --force --options runtime --timestamp --preserve-metadata=entitlements --sign "$IDENTITY" {}
          codesign --force --options runtime --timestamp \
            --preserve-metadata=entitlements --sign "$IDENTITY" "$APP"

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP"
          # Every Mach-O must carry a Developer ID signature with a timestamp.
          find "$APP" -type f -perm -u+x -print0 | while IFS= read -r -d '' f; do
            file -b "$f" | grep -q Mach-O || continue
            info="$(codesign -dvv "$f" 2>&1)"
            echo "$info" | grep -q "Authority=Developer ID Application" || { echo "::error::not Developer ID signed: $f"; exit 1; }
            echo "$info" | grep -q "^Timestamp=" || { echo "::error::no secure timestamp: $f"; exit 1; }
          done
          echo "All nested binaries are Developer ID signed with timestamps."

      - name: Notarize app
        if: steps.signing.outputs.signed == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/asc.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$P8"
          ZIP="$RUNNER_TEMP/$APP_NAME-notarize.zip"
          # notarytool takes an archive, not a .app directory.
          ditto -c -k --keepParent "$APP" "$ZIP"
          # Submit, then always fetch Apple's log so a rejection shows its reasons in the run.
          set +e
          xcrun notarytool submit "$ZIP" \
            --key "$P8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait \
            --output-format json > "$RUNNER_TEMP/notary.json"
          RC=$?
          set -e
          SUB_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
          STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
          echo "Notarization $SUB_ID: ${STATUS:-unknown}"
          if [[ -n "$SUB_ID" ]]; then
            xcrun notarytool log "$SUB_ID" --key "$P8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
          fi
          if [[ $RC -ne 0 || "$STATUS" != "Accepted" ]]; then
            echo "::error::Notarization was not accepted (status: ${STATUS:-unknown}). See the log above."
            exit 1
          fi
          # Staple so Gatekeeper validates offline.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Create DMG
        id: dmg
        run: |
          set -euo pipefail
          brew install create-dmg
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          DMG="$RUNNER_TEMP/$APP_NAME-${{ steps.ver.outputs.tag }}.dmg"
          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 --window-size 600 400 --icon-size 100 \
            --icon "$APP_NAME.app" 175 120 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 425 120 \
            "$DMG" "$STAGE/"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"

      - name: Sign and notarize DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="${{ steps.dmg.outputs.dmg }}"
          codesign --force --sign "$IDENTITY" --timestamp "$DMG"
          # The DMG is notarized separately from the .app inside it, so the
          # download itself also passes Gatekeeper.
          set +e
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait \
            --output-format json > "$RUNNER_TEMP/notary-dmg.json"
          RC=$?
          set -e
          SUB_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary-dmg.json" 2>/dev/null || true)"
          STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary-dmg.json" 2>/dev/null || true)"
          echo "DMG notarization $SUB_ID: ${STATUS:-unknown}"
          if [[ $RC -ne 0 || "$STATUS" != "Accepted" ]]; then
            [[ -n "$SUB_ID" ]] && xcrun notarytool log "$SUB_ID" --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "::error::DMG notarization was not accepted (status: ${STATUS:-unknown})."
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # Attaches to the release that triggered this run. A manual dispatch with
      # publish=true creates the release first if it does not exist yet.
      - name: Attach DMG to the release
        if: github.event_name == 'release' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Only reachable from a manual dispatch; a release trigger already
            # has its release, with whatever notes the author wrote.
            NOTES="$RUNNER_TEMP/notes.md"
            {
              echo "Download the DMG below, open it, and drag $APP_NAME to Applications."
              echo "Existing installs update themselves through Sparkle."
              if [[ "$SIGNED" == "true" ]]; then
                echo
                echo "Signed with a Developer ID certificate and notarized by Apple."
              else
                echo
                echo "⚠️ Unsigned build; macOS warns on first launch (right-click → Open)."
              fi
              echo
              echo "Requires macOS 15.4 (Sequoia) or later."
            } > "$NOTES"
            FLAGS=()
            [[ "$PRERELEASE" == "true" ]] && FLAGS+=(--prerelease)
            gh release create "$TAG" --title "$APP_NAME $TAG" --notes-file "$NOTES" "${FLAGS[@]}"
          fi
          if [[ "$SIGNED" != "true" ]]; then
            echo "::warning::Attaching an UNSIGNED DMG to $TAG."
          fi
          gh release upload "$TAG" "$DMG" --clobber
          echo "Attached $(basename "$DMG") to $TAG"

      # Sparkle: sign the DMG with the EdDSA key, regenerate appcast.xml and
      # commit it to main. SUFeedURL in SoundPilot/Info.plist points at the raw
      # main-branch appcast.xml, so this is what makes in-app updates work.
      - name: Update Sparkle appcast
        if: >-
          (github.event_name == 'release' || inputs.publish)
          && steps.signing.outputs.signed == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "::warning::SPARKLE_PRIVATE_KEY unset — skipping appcast; existing installs will not see $TAG."
            exit 0
          fi
          BIN="$(find "$RUNNER_TEMP/dd" -type f -path '*/artifacts/sparkle/Sparkle/bin/generate_appcast' | head -1)"
          if [[ -z "$BIN" ]]; then
            echo "::error::generate_appcast not found in SPM artifacts"; exit 1
          fi
          KEY="$RUNNER_TEMP/sparkle_ed25519.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          REL="$RUNNER_TEMP/sparkle-release"
          mkdir -p "$REL"
          cp "${{ steps.dmg.outputs.dmg }}" "$REL/"
          # The appcast is a running feed: seed the generator with the committed
          # one so prior versions survive instead of being replaced.
          git fetch origin main
          git show origin/main:appcast.xml > "$REL/appcast.xml" || true
          "$BIN" \
            --ed-key-file "$KEY" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$TAG/" \
            --link "https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            -o "$REL/appcast.xml" \
            "$REL"
          rm -f "$KEY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The run checked out a tag, which is a detached HEAD; move to main to commit.
          git checkout -B main origin/main
          cp "$REL/appcast.xml" appcast.xml
          git add appcast.xml
          git commit -m "chore(release): appcast for $TAG" || { echo "appcast unchanged"; exit 0; }
          git push origin main

      - name: Upload DMG artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.ver.outputs.tag }}
          path: ${{ steps.dmg.outputs.dmg }}
          if-no-files-found: warn
          retention-days: 30
